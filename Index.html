<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو سيكس سيفن بيتزا</title>
    <style>
        /* إعدادات التصميم الأساسية */
        :root {
            --primary-color: #ff4757;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }

        /* تصميم الرأس (الهيدر) */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1513104890138-7c749659a591?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80') center/cover;
            border-bottom: 3px solid var(--primary-color);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #fff;
        }

        header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* أزرار التصنيفات */
        .categories {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .category-btn {
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--text-color);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* شبكة عرض المنيو */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* تصميم بطاقة الوجبة */
        .menu-item {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .menu-item:hover {
            transform: translateY(-5px);
        }

        .item-details h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
        }

        .item-details p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .item-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background-color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 10px;
        }

        /* أنيمشن الظهور */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>سيكس سيفن بيتزا</h1>
        <p>قائمة الطعام المحدثة يومياً</p>
    </header>

    <!-- أزرار التصنيفات -->
    <div class="categories" id="category-buttons">
        <!-- سيتم إضافة الأزرار برمجياً -->
    </div>

    <!-- مكان عرض الوجبات -->
    <div class="menu-container" id="menu-container">
        <!-- سيتم إضافة الوجبات برمجياً -->
    </div>
